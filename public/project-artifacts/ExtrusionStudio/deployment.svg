<svg xmlns="http://www.w3.org/2000/svg" id="es-deploy" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="es-deploy-title es-deploy-desc">
<title id="es-deploy-title">ExtrusionStudio plant deployment</title>
<desc id="es-deploy-desc">Three extrusion lines, each with a tri-axial laser gauge, are read over Modbus TCP by one Debian server that runs every panel and keeps every log. Raspberry Pi kiosks around the plant only display pages from the server: a projector, one touch screen per line, the packing bench, and a TV for production statistics; the server also switches those screens on and off with the work hours. Staff open Server Settings and Admin Settings from any browser.</desc>
<style>
#es-deploy{--t-paper:var(--paper,#fbfbf9);--t-white:var(--white,#ffffff);--t-ink:var(--ink,#0b1a2b);--t-ink-soft:var(--ink-soft,#46545f);--t-muted:var(--muted,#616b75);--t-faint:var(--faint,#838b92);--t-rule:var(--rule,#d9dee3);--t-accent:var(--accent,#e3342f);--t-blue:var(--blue,#2f86c4);--t-body:var(--bp-font-body,Spectral,Georgia,serif);--t-serif:var(--bp-font-subheader,"Instrument Serif",Georgia,serif)}
@media (prefers-color-scheme:dark){#es-deploy{--t-paper:var(--paper,#0d1b2a);--t-white:var(--white,#142a3d);--t-ink:var(--ink,#eef3f7);--t-ink-soft:var(--ink-soft,#b9c3cc);--t-muted:var(--muted,#9aa6b1);--t-faint:var(--faint,#7b8793);--t-rule:var(--rule,#24384c)}}
#es-deploy text{font-family:var(--t-body);fill:var(--t-ink);font-size:13px}
#es-deploy .h{font-family:var(--t-serif);font-size:17px}
#es-deploy .s{fill:var(--t-muted);font-size:11.5px}
#es-deploy .k{fill:var(--t-faint);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
#es-deploy .box{fill:var(--t-white);stroke:var(--t-rule);stroke-width:1}
#es-deploy .srv{fill:var(--t-white);stroke:var(--t-ink);stroke-width:1.2}
#es-deploy .wire{fill:none;stroke:var(--t-ink);stroke-width:1.1;stroke-opacity:.55}
#es-deploy .wire-bus{fill:none;stroke:var(--t-blue);stroke-width:1.4}
#es-deploy .wire-pwr{fill:none;stroke:var(--t-accent);stroke-width:1.1;stroke-dasharray:4 4}
#es-deploy .lbl{fill:var(--t-paper)}
#es-deploy .tag{font-size:10.5px;fill:var(--t-ink-soft)}
#es-deploy .dot{fill:var(--t-accent)}
#es-deploy .pi{fill:var(--t-paper);stroke:var(--t-rule);stroke-width:1}
</style>
<rect width="1100" height="620" fill="none"/>

<!-- column headers -->
<text class="k" x="40" y="34">EXTRUSION LINES</text>
<text class="k" x="420" y="34">ONE SERVER · DEBIAN 13 · HEADLESS</text>
<text class="k" x="800" y="34">RASPBERRY PI KIOSKS · DISPLAY ONLY</text>

<!-- lines -->
<g>
  <rect class="box" x="40" y="60" width="250" height="78" rx="4"/>
  <text class="h" x="56" y="90">Extrusion Line 1</text>
  <text class="s" x="56" y="110">Tri-axial laser gauge · PLC</text>
  <text class="s" x="56" y="126">X · Y · Z · average, 20 Hz</text>

  <rect class="box" x="40" y="160" width="250" height="78" rx="4"/>
  <text class="h" x="56" y="190">Extrusion Line 2</text>
  <text class="s" x="56" y="210">Tri-axial laser gauge · PLC</text>
  <text class="s" x="56" y="226">X · Y · Z · average, 20 Hz</text>

  <rect class="box" x="40" y="260" width="250" height="78" rx="4"/>
  <text class="h" x="56" y="290">Extrusion Line 3</text>
  <text class="s" x="56" y="310">Tri-axial laser gauge · PLC</text>
  <text class="s" x="56" y="326">X · Y · Z · average, 20 Hz</text>

  <rect class="box" x="40" y="360" width="250" height="52" rx="4" stroke-dasharray="4 4"/>
  <text class="s" x="56" y="392">Line 4, 5, 6 … any number of lines</text>
</g>

<!-- modbus bus -->
<path class="wire-bus" d="M290 99 H350 V380 H290 M290 199 H350 M290 299 H350 M350 240 H420"/>
<rect class="lbl" x="296" y="226" width="78" height="18" rx="9"/>
<text class="tag" x="335" y="239" text-anchor="middle">Modbus TCP</text>

<!-- server -->
<g>
  <rect class="srv" x="420" y="60" width="330" height="470" rx="6"/>
  <text class="h" x="440" y="92">ExtrusionStudio server</text>
  <text class="s" x="440" y="112">Starts at power-on · updates itself at 04:00</text>

  <text class="k" x="440" y="146">PANELS, EACH ITS OWN PROCESS</text>
  <rect class="box" x="440" y="156" width="290" height="30" rx="3"/><text x="452" y="176">Server Settings</text><text class="s" x="722" y="176" text-anchor="end">start, stop, Pis, users</text>
  <rect class="box" x="440" y="192" width="290" height="30" rx="3"/><text x="452" y="212">Admin Settings</text><text class="s" x="722" y="212" text-anchor="end">reads the gauges · owns state</text>
  <rect class="box" x="440" y="228" width="290" height="30" rx="3"/><text x="452" y="248">Operator-Graphs</text><text class="s" x="722" y="248" text-anchor="end">projector</text>
  <rect class="box" x="440" y="264" width="290" height="30" rx="3"/><text x="452" y="284">Operator-GUI</text><text class="s" x="722" y="284" text-anchor="end">one line per station</text>
  <rect class="box" x="440" y="300" width="290" height="30" rx="3"/><text x="452" y="320">Packaging Panel</text><text class="s" x="722" y="320" text-anchor="end">approve · print labels</text>
  <rect class="box" x="440" y="336" width="290" height="30" rx="3"/><text x="452" y="356">Production Statistics</text><text class="s" x="722" y="356" text-anchor="end">read-only board</text>

  <text class="k" x="440" y="400">DATA KEPT HERE</text>
  <text x="440" y="422">One CSV per spool · SQLite run table</text>
  <text x="440" y="442">Spool certificates · filament files · audit log</text>
  <text class="s" x="440" y="462">Mirrored to a share on a schedule</text>

  <text class="k" x="440" y="496">WORK HOURS</text>
  <text x="440" y="516">Screens on 1 h before the day, off after it</text>
</g>

<!-- http to pis -->
<path class="wire" d="M750 95 H800 M750 180 H800 M750 265 H800 M750 350 H800 M750 435 H800"/>
<rect class="lbl" x="755" y="212" width="40" height="18" rx="9"/>
<text class="tag" x="775" y="225" text-anchor="middle">HTTP</text>

<!-- pis -->
<g>
  <rect class="pi" x="800" y="60" width="260" height="70" rx="4"/>
  <text class="h" x="816" y="86">Projector</text>
  <text class="s" x="816" y="104">Pi · Operator-Graphs, every line's chart</text>
  <text class="s" x="816" y="120">Epson, woken by the HDMI signal</text>

  <rect class="pi" x="800" y="145" width="260" height="70" rx="4"/>
  <text class="h" x="816" y="171">Line stations × 3</text>
  <text class="s" x="816" y="189">Pi + touch screen at each line</text>
  <text class="s" x="816" y="205">Operator-GUI locked to its line</text>

  <rect class="pi" x="800" y="230" width="260" height="70" rx="4"/>
  <text class="h" x="816" y="256">Packing bench</text>
  <text class="s" x="816" y="274">Pi + touch screen · Packaging Panel</text>
  <text class="s" x="816" y="290">USB thermal label printer</text>

  <rect class="pi" x="800" y="315" width="260" height="70" rx="4"/>
  <text class="h" x="816" y="341">Statistics TV</text>
  <text class="s" x="816" y="359">Pi · Production Statistics</text>
  <text class="s" x="816" y="375">Vizio switched over the LAN, paired by PIN</text>

  <rect class="pi" x="800" y="400" width="260" height="70" rx="4"/>
  <text class="h" x="816" y="426">Any browser</text>
  <text class="s" x="816" y="444">Server Settings · Admin Settings</text>
  <text class="s" x="816" y="460">Sign-in, roles, audit of every change</text>
</g>

<!-- power control -->
<path class="wire-pwr" d="M750 516 H780 V130 H800 M780 215 H800 M780 300 H800 M780 385 H800"/>
<rect class="lbl" x="742" y="536" width="150" height="18" rx="9"/>
<text class="tag" x="817" y="549" text-anchor="middle">screen on / off, daily</text>

<!-- legend -->
<g>
  <path class="wire-bus" d="M40 590 H70"/><text class="s" x="78" y="594">Modbus TCP, one session per line</text>
  <path class="wire" d="M300 590 H330"/><text class="s" x="338" y="594">Pages served to the kiosks</text>
  <path class="wire-pwr" d="M520 590 H550"/><text class="s" x="558" y="594">Power follows the work hours</text>
  <circle class="dot" cx="760" cy="590" r="3"/><text class="s" x="770" y="594">Nothing is stored on a Pi</text>
</g>
</svg>
