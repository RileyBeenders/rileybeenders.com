<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img"><title>Install flow</title><desc>One-time setup: install.ps1 downloads the script, verifies its hash, elevates once, installs the workers and scheduled tasks, and creates the desktop shortcut.</desc><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600}.ts{font-size:12px}.lg{font-size:12px;fill:#5F5E5A}.arr{stroke:#888780;stroke-width:1.5;fill:none}.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}.red rect{fill:#FCEBEB;stroke:#A32D2D}.red .th{fill:#791F1F}.red .ts{fill:#A32D2D}@media (prefers-color-scheme:dark){.lg{fill:#B4B2A9}.arr{stroke:#B4B2A9}.gray rect{fill:#444441;stroke:#B4B2A9}.gray .th{fill:#D3D1C7}.gray .ts{fill:#B4B2A9}.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .th{fill:#CECBF6}.purple .ts{fill:#AFA9EC}.teal rect{fill:#085041;stroke:#5DCAA5}.teal .th{fill:#9FE1CB}.teal .ts{fill:#5DCAA5}.red rect{fill:#791F1F;stroke:#F09595}.red .th{fill:#F7C1C1}.red .ts{fill:#F09595}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="gray"><rect x="210" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340.0" y="58" text-anchor="middle" dominant-baseline="central">Run the one-liner</text><text class="ts" x="340.0" y="76" text-anchor="middle" dominant-baseline="central">irm install.ps1 | iex</text></g><line x1="340" y1="96" x2="340" y2="146" class="arr" marker-end="url(#arrow)"/><g class="purple"><rect x="210" y="156" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340.0" y="174" text-anchor="middle" dominant-baseline="central">Download and verify</text><text class="ts" x="340.0" y="192" text-anchor="middle" dominant-baseline="central">SHA-256 vs version.json</text></g><line x1="470" y1="184" x2="500" y2="184" class="arr" marker-end="url(#arrow)"/><g class="red"><rect x="510" y="156" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="575.0" y="174" text-anchor="middle" dominant-baseline="central">Install stops</text><text class="ts" x="575.0" y="192" text-anchor="middle" dominant-baseline="central">hash mismatch</text></g><line x1="340" y1="212" x2="340" y2="262" class="arr" marker-end="url(#arrow)"/><g class="gray"><rect x="210" y="272" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340.0" y="290" text-anchor="middle" dominant-baseline="central">Elevated setup</text><text class="ts" x="340.0" y="308" text-anchor="middle" dominant-baseline="central">one UAC prompt, checks WinGet</text></g><line x1="340" y1="328" x2="340" y2="378" class="arr" marker-end="url(#arrow)"/><g class="teal"><rect x="210" y="388" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340.0" y="406" text-anchor="middle" dominant-baseline="central">Install workers and tasks</text><text class="ts" x="340.0" y="424" text-anchor="middle" dominant-baseline="central">launcher, worker, 2 tasks</text></g><line x1="340" y1="444" x2="340" y2="494" class="arr" marker-end="url(#arrow)"/><g class="teal"><rect x="210" y="504" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340.0" y="522" text-anchor="middle" dominant-baseline="central">Create desktop shortcut</text><text class="ts" x="340.0" y="540" text-anchor="middle" dominant-baseline="central">custom icon from icon.png</text></g><g class="gray"><rect x="40" y="598" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="lg" x="58" y="604" dominant-baseline="central">user steps</text><g class="purple"><rect x="150" y="598" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="lg" x="168" y="604" dominant-baseline="central">security check</text><g class="teal"><rect x="280" y="598" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="lg" x="298" y="604" dominant-baseline="central">installed on the PC</text></svg>
