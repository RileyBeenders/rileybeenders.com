<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760" role="img"><title>Everyday run flow</title><desc>Each launch: the launcher checks version.json, self-updates through an elevated task if a newer release exists, then scans WinGet, asks for confirmation, and hands the upgrades to the elevated worker task.</desc><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600}.ts{font-size:12px}.lg{font-size:12px;fill:#5F5E5A}.arr{stroke:#888780;stroke-width:1.5;fill:none}.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}.red rect{fill:#FCEBEB;stroke:#A32D2D}.red .th{fill:#791F1F}.red .ts{fill:#A32D2D}@media (prefers-color-scheme:dark){.lg{fill:#B4B2A9}.arr{stroke:#B4B2A9}.gray rect{fill:#444441;stroke:#B4B2A9}.gray .th{fill:#D3D1C7}.gray .ts{fill:#B4B2A9}.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .th{fill:#CECBF6}.purple .ts{fill:#AFA9EC}.teal rect{fill:#085041;stroke:#5DCAA5}.teal .th{fill:#9FE1CB}.teal .ts{fill:#5DCAA5}.red rect{fill:#791F1F;stroke:#F09595}.red .th{fill:#F7C1C1}.red .ts{fill:#F09595}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="gray"><rect x="40" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="58" text-anchor="middle" dominant-baseline="central">Open desktop shortcut</text><text class="ts" x="170.0" y="76" text-anchor="middle" dominant-baseline="central">launcher runs without UAC</text></g><line x1="170" y1="96" x2="170" y2="146" class="arr" marker-end="url(#arrow)"/><g class="purple"><rect x="40" y="156" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="174" text-anchor="middle" dominant-baseline="central">Check version.json</text><text class="ts" x="170.0" y="192" text-anchor="middle" dominant-baseline="central">newer release available?</text></g><line x1="300" y1="184" x2="350" y2="184" class="arr" marker-end="url(#arrow)"/><text class="lg" x="325" y="170" text-anchor="middle" dominant-baseline="central">yes</text><g class="teal"><rect x="360" y="156" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500.0" y="174" text-anchor="middle" dominant-baseline="central">Self-update task (elevated)</text><text class="ts" x="500.0" y="192" text-anchor="middle" dominant-baseline="central">verify SHA-256, reinstall</text></g><line x1="500" y1="212" x2="500" y2="262" class="arr" marker-end="url(#arrow)"/><g class="gray"><rect x="360" y="272" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500.0" y="290" text-anchor="middle" dominant-baseline="central">Restart launcher</text><text class="ts" x="500.0" y="308" text-anchor="middle" dominant-baseline="central">skips the update check once</text></g><line x1="360" y1="300" x2="310" y2="300" class="arr" marker-end="url(#arrow)"/><line x1="170" y1="212" x2="170" y2="262" class="arr" marker-end="url(#arrow)"/><text class="lg" x="150" y="237" text-anchor="end" dominant-baseline="central">no</text><g class="gray"><rect x="40" y="272" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="290" text-anchor="middle" dominant-baseline="central">Scan with WinGet</text><text class="ts" x="170.0" y="308" text-anchor="middle" dominant-baseline="central">show available upgrades</text></g><line x1="170" y1="328" x2="170" y2="378" class="arr" marker-end="url(#arrow)"/><g class="gray"><rect x="40" y="388" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="406" text-anchor="middle" dominant-baseline="central">Confirm</text><text class="ts" x="170.0" y="424" text-anchor="middle" dominant-baseline="central">install all updates? [Y/N]</text></g><line x1="170" y1="444" x2="170" y2="494" class="arr" marker-end="url(#arrow)"/><g class="teal"><rect x="40" y="504" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="522" text-anchor="middle" dominant-baseline="central">Worker task (elevated)</text><text class="ts" x="170.0" y="540" text-anchor="middle" dominant-baseline="central">upgrades packages one by one</text></g><line x1="170" y1="560" x2="170" y2="610" class="arr" marker-end="url(#arrow)"/><g class="gray"><rect x="40" y="620" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="638" text-anchor="middle" dominant-baseline="central">Summary</text><text class="ts" x="170.0" y="656" text-anchor="middle" dominant-baseline="central">failures explained, some retried</text></g><g class="gray"><rect x="40" y="716" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="lg" x="58" y="722" dominant-baseline="central">runs as you, no UAC</text><g class="purple"><rect x="200" y="716" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="lg" x="218" y="722" dominant-baseline="central">security check</text><g class="teal"><rect x="330" y="716" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="lg" x="348" y="722" dominant-baseline="central">scheduled task, pre-approved admin</text></svg>
